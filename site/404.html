<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; style-src 'self'; script-src 'self'; img-src https://avatars.githubusercontent.com https://www.kisa.or.kr; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>공지 문서 확인 중 · KISA Notice</title>
  <link rel="icon" href="https://avatars.githubusercontent.com/u/51371743?v=4">

  <script src="/KISA-Bohonara-Support/assets/not-found.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-brand" href="/KISA-Bohonara-Support/">
        <span class="site-logo"><img src="https://www.kisa.or.kr/resource/kor/images/sub/sub_CI_logo_signature_9.png" alt=""></span>
        <span class="site-name">KISA Notice</span>
      </a>
    </div>
  </header>
  <main class="page-shell">
    <section class="pending-card">
      <div class="pending-card__mark" aria-hidden="true">
        <svg viewBox="0 0 16 16"><path d="M8 1a7 7 0 1 0 7 7 7.008 7.008 0 0 0-7-7Zm0 12.5A5.5 5.5 0 1 1 13.5 8 5.506 5.506 0 0 1 8 13.5Zm.75-9v4.19l2.72 1.57-.75 1.3-3.47-2V4.5Z"/></svg>
      </div>
      <p class="pending-card__eyebrow">Security notice</p>
      <h1 id="page-title">페이지를 찾을 수 없습니다</h1>
      <p class="pending-card__description" id="page-description">요청한 주소를 확인하거나 저장된 보안공지 목록으로 이동해 주세요.</p>
      <div class="pending-card__actions">
        <button class="button button--primary" id="retry-button" type="button" hidden>다시 확인</button>
        <a class="button" id="source-link" href="https://www.boho.or.kr/kr/bbs/list.do?menuNo=205020&amp;bbsId=B0000133">KISA 원문</a>
        <a class="button" href="/KISA-Bohonara-Support/">공지 목록</a>
      </div>
      <p class="pending-card__status" id="check-status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
