name: Benchmark notice translations

on:
  workflow_dispatch:
    inputs:
      notice_url:
        description: Reference notice URL
        type: string
      notice_title:
        description: Reference notice title
        type: string
      notice_ids:
        description: Optional comma-separated subset of benchmark cases
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare archived translations with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          BENCHMARK_NOTICE_IDS: ${{ inputs.notice_ids }}
        run: python3 scripts/benchmark_notice_translation.py --notice-ids "$BENCHMARK_NOTICE_IDS"
      - name: Save results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: notice-translation-benchmark
          path: benchmark-results/
          retention-days: 7
