name: Process KISA notice

on:
  workflow_dispatch:
    inputs:
      notice_url:
        description: KISA notice URL
        required: true
        type: string
      notice_title:
        description: KISA notice title
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: kisa-notice-formatter
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out formatter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Generate Korean and English pages
        id: generate
        env:
          NOTICE_URL: ${{ inputs.notice_url }}
          NOTICE_TITLE: ${{ inputs.notice_title }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MYMEMORY_CONTACT_EMAIL: ${{ secrets.MYMEMORY_CONTACT_EMAIL }}
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/process_notice.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Generation failed temporarily; retrying in 15 seconds."
              sleep 15
            fi
          done
          exit 1

      - name: Save generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/notices
          if git diff --cached --quiet; then
            echo "Notice pages are already current."
          else
            git commit -m "content: add KISA notice ${{ steps.generate.outputs.notice_id }}"
            git push origin HEAD:main
          fi
