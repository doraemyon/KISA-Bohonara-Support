name: Process KISA notice

on:
  workflow_dispatch:
    inputs:
      notice_url:
        description: KISA notice URL
        required: true
        type: string
      notice_title:
        description: KISA notice title
        required: true
        type: string
      telegram_message_id:
        description: Telegram message to enhance
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kisa-notice-formatter
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out formatter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install free translation library
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: Generate Korean and English pages
        id: generate
        env:
          NOTICE_URL: ${{ inputs.notice_url }}
          NOTICE_TITLE: ${{ inputs.notice_title }}
        run: python3 scripts/process_notice.py

      - name: Save generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/notices
          if git diff --cached --quiet; then
            echo "Notice pages are already current."
          else
            git commit -m "content: add KISA notice ${{ steps.generate.outputs.notice_id }}"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Add language buttons to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_ID: ${{ inputs.telegram_message_id }}
          NOTICE_ID: ${{ steps.generate.outputs.notice_id }}
          NOTICE_URL: ${{ inputs.notice_url }}
          PUBLIC_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/update_telegram_buttons.py
